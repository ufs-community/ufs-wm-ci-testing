name: Pull Request Post-Action
on:
  workflow_run:
    workflows: ["UFS Weather Model PR Test"] 
    types:
      - completed

permissions:
  pull-requests: write
  contents: read

jobs:
  post-build:
    name: Post-Build
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [orion, hercules, gaeac6, ursa]
    
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    permissions:
      id-token: write
      contents: read 
      pull-requests: write
    steps:
      - name: Configure AWS Credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211527314271:role/github-actions-s3 
          aws-region: us-east-1

      - name: Upload Files to S3 via AWS CLI
        if: always()
        run: |
          aws s3 cp ${GITHUB_WORKSPACE}/tests/logs/ s3://noaa-epic-prod-jenkins-artifacts/kb-test/ --recursive --exclude "*" --include "*.tgz" 
      - name: Send Slack Notification
        if: always() 
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0C7AJ84X3P", 
              "text": ":epic: *${{ github.event.workflow_run.name }}* completed on *${{ matrix.runner }}* with status: *${{ job.status }}*"
            }
  
