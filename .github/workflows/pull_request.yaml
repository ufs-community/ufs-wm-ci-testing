# This is a basic workflow that is manually triggered

name: UFS Weather Model PR Test

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  pull_request:
    branches:
      - develop
        
  workflow_dispatch: 
jobs:
  run-on-runners:
    name: Execute on Selected Runner
    strategy:
      fail-fast: false
      matrix:
        runner: [orion, hercules, gaeac6, ursa]
    
    # self-hosted is required, followed by the specific runner label from the matrix
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    environment: develop
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      actions: write
      

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
         submodules: recursive
        
      - name: UFS Weather Model build 
        run: |
          echo "Building on runner: ${{ matrix.runner }}"
          export NODE_NAME=${{ matrix.runner }}
          export UFS_COMPILER="oneapi"
          #.cicd/scripts/wm_build.sh
  
      - name: UFS Weather Model test
        run: |
          echo "Building on runner: ${{ matrix.runner }}"
          export RUNNER_NAME=${{ matrix.runner }}
          export NODE_NAME="${RUNNER_NAME^}"
          export UFS_PLATFORM="${RUNNER_NAME}"
          export UFS_COMPILER="oneapi"
          export ACCNR=epic
          sed  's/workflow="-r"/workflow="-e"/g' -i .cicd/scripts/regression_test.sh || true
          export WM_REGRESSION_TESTS=true
          export WM_OPERATIONAL_TESTS=control_c48
          #CREATE_BASELINE=false .cicd/scripts/wm_test.sh 


      - name: UFS Weather Model Post Test Results 
        id: post-results
        run: |
          export RUNNER_NAME=${{ matrix.runner }}
          export NODE_NAME="${RUNNER_NAME^}"
          export UFS_PLATFORM="${RUNNER_NAME}"
          export UFS_COMPILER="oneapi"
          [[ -d tests/logs ]] && cd tests/logs && tar --create --gzip --verbose --dereference --file ../../wm_test_logs-${UFS_PLATFORM}-${UFS_COMPILER}.tgz log_${UFS_PLATFORM}/* RegressionTests_${UFS_PLATFORM}.log || cat /dev/null > ../../wm_test_logs-${UFS_PLATFORM}-${UFS_COMPILER}.tgz
          cd ${GITHUB_WORKSPACE}
          #.cicd/scripts/post_test_results.sh $UFS_PLATFORM RT

      - name: Trigger downstream post-build for ${{ matrix.runner }}
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type='node-build-finished' \
            -F client_payload[node]='${{ matrix.runner }}' \
            -F client_payload[status]='${{ steps.post-results.outcome }}' \
            -F client_payload[pr_number]='${{ github.event.pull_request.number }}' \
            -F client_payload[head_sha]='${{ github.event.pull_request.head.sha }}' \
            -F client_payload[run_id]='${{ github.run_id }}'\
            -F client_payload[workflow_name]='${{ github.workflow }}'
            
